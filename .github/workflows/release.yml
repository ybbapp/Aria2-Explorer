---
name: "tagged-release"
permissions:
  contents: write

on:
  push:
    tags:
      - v*

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"    
    
    steps:    
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build Extensions
        run: |
          npm run build:all
      
      - name: Rename artifacts
        run: |
          mv dist/aria2-explorer-chrome.zip dist/aria2e-chrome-${{ github.ref_name }}.zip
          mv dist/aria2-explorer-firefox.zip dist/aria2e-firefox-${{ github.ref_name }}.zip
          # Create XPI (Firefox extension format - same as ZIP but with .xpi extension)
          cp dist/aria2e-firefox-${{ github.ref_name }}.zip dist/aria2e-firefox-${{ github.ref_name }}.xpi
      
      - name: Create Chrome CRX
        uses: "cardinalby/webext-buildtools-chrome-crx-action@v2"
        with:
          zipFilePath: "dist/aria2e-chrome-${{ github.ref_name }}.zip"
          crxFilePath: "dist/aria2e-chrome-${{ github.ref_name }}.crx"
          privateKey: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}

      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ github.ref_name }}"
          prerelease: false
          files: |
            dist/aria2e-chrome-${{ github.ref_name }}.crx
            dist/aria2e-chrome-${{ github.ref_name }}.zip
            dist/aria2e-firefox-${{ github.ref_name }}.zip
            dist/aria2e-firefox-${{ github.ref_name }}.xpi
